<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | DIU Alumni Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="banner-fixed"></div>

    <nav class="menubar navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="home.html">
                <img src="DIU LOGO.PNG" alt="DIU Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
                    aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="alumni.html" target="_blank">Alumni List</a></li>
                    <li class="nav-item"><a class="nav-link" href="success.html" target="_blank">Success Story</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html" target="_blank">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
                <a class="btn btn-join" href="join.html" target="_blank">Join Now</a>
            </div>
        </div>
    </nav>

    <div class="page-head">
        <h1>CONTACT US</h1>
        <p>We would love to hear from you. Send us a message today.</p>
    </div>

    <form class="contact-form">
        <div class="mb-3">
            <label for="fname" class="form-label">First Name</label>
            <input type="text" class="form-control" id="fname" name="firstname" placeholder="Enter First Name...." required>
        </div>
        <div class="mb-3">
            <label for="lname" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lname" name="lastname" placeholder="Enter Last Name...." required>
        </div>
        <div class="mb-3">
            <label for="ID" class="form-label">Student ID</label>
            <input type="number" class="form-control" id="ID" name="studentid" placeholder="Enter Valid Student ID..." required>
        </div>
        <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select id="department" name="department" class="form-select">
                <option value="cse">Computer Science and Engineering (CSE)</option>
                <option value="cis">Computer Information Systems (CIS)</option>
                <option value="swe">Software Engineering (SWE)</option>
                <option value="eee">Electrical and Electronic Engineering (EEE)</option>
                <option value="bba">Bachelor of Business Administration (BBA)</option>
            </select>
        </div>
        <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter Your Email..." required>
        </div>
        <button type="submit" class="btn btn-submit mt-2">Send Message</button>
    </form>

    <footer>
        <p>&copy; 2026 DIU Alumni Portal &nbsp;|&nbsp; <a href="home.html">Back to Home</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
